name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]

    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DFGB_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure

      - name: Smoke test (VMC to OSC)
        if: matrix.config == 'Release'
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: python tools/smoke_vmc.py --cli build/bin/${{ matrix.config }}/fgb-cli.exe
