name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要打包的 tag（例如 v1.0.1）"
        required: true
      runtime_url:
        description: "可选：VRCFT 运行时压缩包 URL（覆盖仓库变量）"
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check version matches tag
        shell: pwsh
        run: |
          $text = Get-Content CMakeLists.txt -Raw
          if ($text -notmatch 'project\(FaceGazeBridge\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)') {
            throw "无法从 CMakeLists.txt 读取版本"
          }
          $version = $Matches[1]
          if ("v$version" -ne $env:TAG) {
            throw "tag $env:TAG 与 CMakeLists.txt 的版本 $version 不一致"
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "版本：$version"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Configure
        run: cmake -S . -B build/release -G "Visual Studio 17 2022" -A x64 -DFGB_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build/release --config Release --parallel

      - name: Test
        run: ctest --test-dir build/release -C Release --output-on-failure

      - name: Install dist
        run: cmake --install build/release --config Release --prefix dist

      - name: Package SDK
        shell: pwsh
        run: |
          & .\packaging\pack_sdk.ps1 -Version $env:VERSION -DistDir dist -OutputDir dist-installer

      - name: Fetch VRCFT runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNTIME_URL: ${{ github.event.inputs.runtime_url || vars.VRCFT_RUNTIME_URL }}
        run: |
          $zip = Join-Path $PWD "vrcft-runtime.zip"
          if ($env:RUNTIME_URL) {
            Write-Host "下载 runtime_url"
            $curlArgs = @("-fsSL", "-o", $zip)
            # 私有仓库的 Release 资产需要鉴权；不要把这个 token 发给第三方主机。
            if ($env:RUNTIME_URL -match '^https://api\.github\.com/') {
              $curlArgs += @("-H", "Authorization: Bearer $env:GH_TOKEN")
              $curlArgs += @("-H", "Accept: application/octet-stream")
            } elseif ($env:RUNTIME_URL -match '^https://github\.com/') {
              $curlArgs += @("-H", "Authorization: Bearer $env:GH_TOKEN")
            }
            $curlArgs += $env:RUNTIME_URL
            & curl.exe @curlArgs
            if ($LASTEXITCODE -ne 0) {
              # 私有仓库的浏览器下载地址即便带 token 也会 404，回退到 gh release download。
              if ($env:RUNTIME_URL -match '^https://github\.com/([^/]+)/([^/]+)/releases/download/([^/]+)/([^/?]+)$') {
                Remove-Item $zip -Force -ErrorAction SilentlyContinue
                & gh release download $Matches[3] --repo "$($Matches[1])/$($Matches[2])" `
                  --pattern $Matches[4] --output $zip --clobber
              }
              if ($LASTEXITCODE -ne 0) { throw "下载运行时失败：$env:RUNTIME_URL" }
            }
          } else {
            Write-Host "从最近一个已发布 Release 下载 vrcft-runtime.zip"
            & gh release download --pattern "vrcft-runtime.zip" --output $zip
            if ($LASTEXITCODE -ne 0) {
              throw "找不到运行时：设置仓库变量 VRCFT_RUNTIME_URL，或在任一已发布 Release 附加 vrcft-runtime.zip"
            }
          }
          New-Item -ItemType Directory -Force -Path "dist/runtime/vrcft" | Out-Null
          Expand-Archive -Path $zip -DestinationPath "dist/runtime/vrcft" -Force
          if (-not (Test-Path "dist/runtime/vrcft/VRCFaceTracking.ModuleProcess.exe")) {
            throw "运行时压缩包根目录必须直接包含 VRCFaceTracking.ModuleProcess.exe"
          }

      - name: Build installer
        shell: pwsh
        run: |
          & .\packaging\build_installer.ps1 -Version $env:VERSION -DistDir dist -OutputDir dist-installer

      - name: Checksums
        shell: pwsh
        run: |
          Copy-Item vrcft-runtime.zip dist-installer/vrcft-runtime.zip -Force
          $files = @(
            "dist-installer/FaceGazeBridge-Setup-$env:VERSION.exe",
            "dist-installer/FaceGazeBridge-SDK-$env:VERSION.zip",
            "dist-installer/vrcft-runtime.zip"
          )
          $lines = foreach ($file in $files) {
            "$((Get-FileHash $file -Algorithm SHA256).Hash.ToLower())  $(Split-Path $file -Leaf)"
          }
          Set-Content -Path dist-installer/SHA256SUMS.txt -Value $lines -Encoding ascii
          $lines

      - uses: actions/upload-artifact@v4
        with:
          name: FaceGazeBridge-${{ env.VERSION }}
          path: |
            dist-installer/FaceGazeBridge-Setup-*.exe
            dist-installer/FaceGazeBridge-SDK-*.zip
            dist-installer/vrcft-runtime.zip
            dist-installer/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 发布说明要写"自上一版以来的变更"，每次贴同一段固定文字等于没写
          & git fetch --tags --force --quiet
          $prev = & git describe --tags --abbrev=0 "$env:TAG^" 2>$null
          if ($LASTEXITCODE -ne 0 -or -not $prev) { $prev = $null }
          if ($prev) {
            $header  = "## 自 $prev 以来的变更"
            $changes = @(& git log "$prev..$env:TAG" --no-merges --pretty=format:"- %s")
            Write-Host "变更范围：$prev..$env:TAG（$($changes.Count) 条）"
          } else {
            $header  = "## 本版变更"
            $changes = @(& git log -20 --no-merges --pretty=format:"- %s")
            Write-Host "没有更早的 tag，取最近 20 条提交"
          }
          if (-not $changes -or $changes.Count -eq 0) { $changes = @("- 见提交记录") }
          # 用数组拼接而不是 here-string：YAML 里的缩进会被原样写进 notes，
          # 4 个空格就把整段变成 Markdown 代码块
          $lines = @("FaceGaze Bridge $env:VERSION", "", $header, "") + $changes + @(
            "",
            "## 安装说明",
            "",
            "- 用户级安装（不需要管理员），内置 VRCFT 模块宿主运行时与 VC++ 运行库",
            "- FaceGazeBridge-SDK-$env:VERSION.zip 是原生模块开发包（ABI 头、文档、示例）",
            "- 安装包未签名，首次运行可能被 SmartScreen 拦截；请用 SHA256SUMS.txt 核对文件",
            "- 模块、校准、输出设置保存在 %LOCALAPPDATA%\FaceGazeBridge"
          )
          [System.IO.File]::WriteAllText((Join-Path $PWD "release-notes.md"),
            (($lines -join "`n") + "`n"), (New-Object System.Text.UTF8Encoding($false)))
          $assets = @(
            "dist-installer/FaceGazeBridge-Setup-$env:VERSION.exe",
            "dist-installer/FaceGazeBridge-SDK-$env:VERSION.zip",
            "dist-installer/vrcft-runtime.zip",
            "dist-installer/SHA256SUMS.txt"
          )
          & gh release view $env:TAG --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            & gh release upload $env:TAG @assets --clobber
            & gh release edit $env:TAG --notes-file release-notes.md
          } else {
            & gh release create $env:TAG @assets --draft `
              --title "FaceGaze Bridge $env:VERSION" --notes-file release-notes.md
          }
          if ($LASTEXITCODE -ne 0) { throw "创建/更新 Release 失败" }
